services:
  # Banco de Dados MySQL Oficial
  mysql:
    image: mysql:8.0
    container_name: desafio_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: desafio-essentia
    ports:
      - "3306:3306" # Mapeado direto na porta padrão física do Windows
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Banco de Dados MongoDB Oficial (Desafio Opcional de Logs)
  mongodb:
    image: mongo:6.0
    container_name: desafio_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Serviço do Backend (Node.js + Express) - ADICIONADO REATIVO!
  backend:
    build: ./backend
    container_name: desafio_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Padrão Docker: o host vira o nome do serviço interno do compose (@mysql e @mongodb)
      - DATABASE_URL=mysql://root:root@mysql:3306/desafio-essentia
      - MONGO_URI=mongodb://mongodb:27017/desafio_todo
      - PORT=3000
    depends_on:
      mysql:
        condition: service_healthy # Só liga o Express quando o MySQL der o sinal verde de saúde
      mongodb:
        condition: service_started

volumes:
  mysql_data:
  mongo_data:
